services:
  app:
    build: .
    container_name: groovebox-app
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/app/data
      - media-data:/app/media
      - static-data:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: groovebox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media-data:/app/media:ro
      - static-data:/app/staticfiles:ro
    depends_on:
      - app

volumes:
  db-data:
  media-data:
  static-data: